<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1390" role="img" aria-labelledby="titulo desc" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="titulo">Diagrama de despliegue de IQ Platform</title>
  <desc id="desc">De izquierda a derecha, SIMIQ3D, DataIQ y SIVRI. Los navegadores cargan los tres frontends desde Vercel, por el mismo dominio (/simiq3d/* y /sivri/* son rewrites hacia el proyecto de cada módulo), donde también corren el backend de SIMIQ3D y la API de DataIQ; GitHub Actions despliega en Vercel en cada push a main. El backend de SIMIQ3D pide la acción al modelo de lenguaje en el Servidor PC2 y el catálogo a la API; el frontend de SIMIQ3D lee la mesa de la API por el rewrite. El frontend de SIVRI pide un token corto a la API y envía los cuadros al backend de SIVRI en el Servidor PC1, que pide el catálogo a la API. Cada módulo tiene su base en Neon.</desc>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4752"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1260" height="1390" rx="18" fill="#ffffff"/>

  <!-- Título: tipo y alcance -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2933">Diagrama de despliegue de IQ Platform</text>
  <text x="40" y="72" font-size="13.5" fill="#5b6573">Dónde corre cada pieza en producción y cómo llega ahí · modelo C4</text>

  <!-- ===== Nodos ===== -->
  <g stroke="#9aa3ad" stroke-width="1.5" fill="#f6f7f9">
    <rect x="40" y="100" width="260" height="130" rx="14"/>
    <rect x="340" y="100" width="880" height="130" rx="14"/>
    <rect x="40" y="290" width="1180" height="440" rx="14"/>
    <rect x="60" y="790" width="300" height="280" rx="14"/>
    <rect x="900" y="790" width="300" height="280" rx="14"/>
    <rect x="40" y="1130" width="1180" height="180" rx="14"/>
  </g>
  <g fill="#1f2933">
    <text x="58" y="128" font-size="14" font-weight="700">GitHub</text>
    <text x="58" y="146" font-size="11.5" fill="#5b6573">[Nodo: repositorio curn-iq]</text>

    <text x="358" y="128" font-size="14" font-weight="700">Dispositivos</text>
    <text x="358" y="146" font-size="11.5" fill="#5b6573">[Nodo: de cada usuario]</text>

    <text x="58" y="318" font-size="14" font-weight="700">Vercel</text>
    <text x="58" y="336" font-size="11.5" fill="#5b6573">[Nodo: plataforma, plan Hobby]</text>

    <text x="78" y="818" font-size="14" font-weight="700">Servidor PC2</text>
    <text x="78" y="836" font-size="11.5" fill="#5b6573">[Nodo: PC de escritorio con GPU]</text>

    <text x="918" y="818" font-size="14" font-weight="700">Servidor PC1</text>
    <text x="918" y="836" font-size="11.5" fill="#5b6573">[Nodo: PC del laboratorio]</text>

    <text x="58" y="1158" font-size="14" font-weight="700">Neon</text>
    <text x="58" y="1176" font-size="11.5" fill="#5b6573">[Nodo: PostgreSQL 18, Ohio]</text>
  </g>

  <!-- Proyectos de Vercel: un nodo por pieza que se despliega aparte -->
  <g stroke="#b3bac3" stroke-width="1.4" fill="#ffffff">
    <rect x="74" y="352" width="272" height="348" rx="10" stroke-dasharray="6 4"/>
    <rect x="494" y="352" width="272" height="148" rx="10"/>
    <rect x="494" y="540" width="272" height="160" rx="10"/>
    <rect x="914" y="352" width="272" height="148" rx="10" stroke-dasharray="6 4"/>
  </g>
  <g font-size="12.5" fill="#1f2933">
    <text x="86" y="372"><tspan font-weight="700">SIMIQ3D</tspan><tspan dx="6" font-size="11" fill="#5b6573">[Proyecto, por definir]</tspan></text>
    <text x="506" y="372"><tspan font-weight="700">Shell y DataIQ</tspan><tspan dx="6" font-size="11" fill="#5b6573">[Proyecto]</tspan></text>
    <text x="506" y="560"><tspan font-weight="700">dataiq-backend</tspan><tspan dx="6" font-size="11" fill="#5b6573">[Proyecto]</tspan></text>
    <text x="926" y="372"><tspan font-weight="700">SIVRI</tspan><tspan dx="6" font-size="11" fill="#5b6573">[Proyecto, por definir]</tspan></text>
  </g>

