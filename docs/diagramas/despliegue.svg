    <text x="170" y="206" font-size="11.5" fill="#5b6573">[Infraestructura: CI/CD]</text>

    <rect x="440" y="160" width="260" height="60" rx="12" fill="#ffffff" stroke="#5b6573" stroke-width="1.6"/>
    <text x="570" y="186" font-size="15" font-weight="700" fill="#1f2933">Navegador web</text>
    <text x="570" y="206" font-size="11.5" fill="#5b6573">[Nodo: computador o celular]</text>

    <rect x="950" y="160" width="220" height="60" rx="12" fill="#ffffff" stroke="#5b6573" stroke-width="1.6"/>
    <text x="1060" y="186" font-size="15" font-weight="700" fill="#1f2933">Navegador web</text>
    <text x="1060" y="206" font-size="11.5" fill="#5b6573">[Nodo: celular con cámara]</text>

