    <text x="210" y="442" font-size="11.5" fill="#5b6573">[Contenedor: Angular + Three.js]</text>
    <text x="210" y="464" font-size="12.5" fill="#3d4752">Archivos estáticos (CDN)</text>

    <rect x="90" y="580" width="240" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <text x="210" y="616" font-size="15" font-weight="700" fill="#1f2933">Backend de SIMIQ3D</text>
    <text x="210" y="636" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI]</text>
    <text x="210" y="658" font-size="12.5" fill="#3d4752">Funciones de Python</text>

    <!-- Vercel: DataIQ -->
    <rect x="510" y="386" width="240" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="630" y="422" font-size="15" font-weight="700" fill="#1f2933">Frontend web</text>
    <text x="630" y="442" font-size="11.5" fill="#5b6573">[Contenedor: Angular]</text>
    <text x="630" y="464" font-size="12.5" fill="#3d4752">Archivos estáticos (CDN)</text>

    <rect x="510" y="580" width="240" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="630" y="616" font-size="15" font-weight="700" fill="#1f2933">API de DataIQ</text>
    <text x="630" y="636" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI]</text>
    <text x="630" y="658" font-size="12.5" fill="#3d4752">Funciones de Python · cle1</text>

    <!-- Vercel: SIVRI -->
    <rect x="930" y="386" width="240" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="1050" y="422" font-size="15" font-weight="700" fill="#1f2933">Frontend de SIVRI</text>
    <text x="1050" y="442" font-size="11.5" fill="#5b6573">[Contenedor: Angular]</text>
    <text x="1050" y="464" font-size="12.5" fill="#3d4752">Archivos estáticos (CDN)</text>

    <!-- Servidor PC2 -->
    <rect x="80" y="856" width="260" height="70" rx="12" fill="#ffffff" stroke="#5b6573" stroke-width="1.6" stroke-dasharray="2 3"/>
    <text x="210" y="886" font-size="15" font-weight="700" fill="#1f2933">Tailscale Funnel</text>
    <text x="210" y="906" font-size="11.5" fill="#5b6573">[Infraestructura: HTTPS fijo]</text>

    <rect x="80" y="956" width="260" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <text x="210" y="992" font-size="15" font-weight="700" fill="#1f2933">Modelo de lenguaje</text>
    <text x="210" y="1012" font-size="11.5" fill="#5b6573">[Contenedor: Ollama]</text>
    <text x="210" y="1034" font-size="12.5" fill="#3d4752">En la GPU</text>

    <!-- Servidor PC1 -->
    <rect x="920" y="856" width="260" height="70" rx="12" fill="#ffffff" stroke="#5b6573" stroke-width="1.6" stroke-dasharray="2 3"/>
    <text x="1050" y="886" font-size="15" font-weight="700" fill="#1f2933">Tailscale Funnel</text>
    <text x="1050" y="906" font-size="11.5" fill="#5b6573">[Infraestructura: HTTPS fijo]</text>

    <rect x="920" y="956" width="260" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="1050" y="992" font-size="15" font-weight="700" fill="#1f2933">Backend de SIVRI</text>
    <text x="1050" y="1012" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI + YOLO26]</text>
    <text x="1050" y="1034" font-size="12.5" fill="#3d4752">En la CPU</text>

    <!-- Neon -->
