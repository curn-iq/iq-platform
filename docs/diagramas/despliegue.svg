    <!-- SIVRI -->
    <line x1="950" y1="486" x2="752" y2="600" marker-end="url(#f)"/>
    <line x1="1150" y1="486" x2="1150" y2="854" marker-end="url(#f)"/>
    <line x1="1050" y1="926" x2="1050" y2="954" marker-end="url(#f)"/>
    <polyline points="920,1006 840,1006 840,650 752,650" marker-end="url(#f)"/>
    <line x1="1050" y1="1056" x2="1050" y2="1206" marker-end="url(#f)"/>
  </g>

  <g font-size="12" fill="#3d4752">
    <text x="182" y="252">Despliega en cada</text>
    <text x="182" y="267">push a main</text>
    <text x="182" y="282" fill="#8a94a3">[CLI de Vercel]</text>

    <text x="421" y="258" text-anchor="end">Explora las mesas</text>
    <text x="421" y="273" text-anchor="end" fill="#8a94a3">[/simiq3d/*]</text>
    <text x="655" y="258">Carga la app</text>
    <text x="655" y="273" fill="#8a94a3">[HTTPS]</text>
    <text x="1142" y="258">Abre SIVRI</text>
    <text x="1142" y="273" fill="#8a94a3">[/sivri/*]</text>

    <text x="222" y="525">Envía la pregunta</text>
    <text x="222" y="540" fill="#8a94a3">[HTTPS, cookie]</text>
    <text x="440" y="514">Lee la mesa</text>
    <text x="440" y="529" fill="#8a94a3">[/api/dataiq/*]</text>
    <text x="420" y="620" text-anchor="middle">Pide el catálogo</text>
    <text x="420" y="648" text-anchor="middle" fill="#8a94a3">[JSON/HTTPS]</text>
    <text x="298" y="755" text-anchor="end">Pide la acción</text>
    <text x="298" y="770" text-anchor="end" fill="#8a94a3">[HTTPS, clave]</text>
    <text x="222" y="945">Reenvía con clave</text>
    <text x="408" y="1095">Guarda el registro</text>
    <text x="408" y="1110" fill="#8a94a3">[SQL, TLS]</text>

    <text x="742" y="520">/api/dataiq/*</text>
    <text x="742" y="535" fill="#8a94a3">[rewrite]</text>
    <text x="642" y="1095">Lee y escribe</text>
    <text x="642" y="1110" fill="#8a94a3">[SQL, TLS]</text>

    <text x="903" y="524">Pide un token corto</text>
    <text x="903" y="539" fill="#8a94a3">[cookie]</text>
    <text x="1138" y="755" text-anchor="end">Envía cuadros</text>
    <text x="1138" y="770" text-anchor="end" fill="#8a94a3">[HTTPS, token]</text>
    <text x="1062" y="945">Reenvía (HTTP local)</text>
    <text x="832" y="870" text-anchor="end">Pide el catálogo</text>
    <text x="832" y="885" text-anchor="end" fill="#8a94a3">[JSON/HTTPS, Bearer]</text>
    <text x="1062" y="1095">Guarda el progreso</text>
    <text x="1062" y="1110" fill="#8a94a3">[SQL, TLS]</text>
  </g>

  <!-- ===== Leyenda ===== -->
  <g font-size="12" fill="#5b6573">
