    <text x="598" y="1352">Por definir</text>
    <line x1="686" y1="1347" x2="722" y2="1347" stroke="#3d4752" stroke-width="1.7" marker-end="url(#f)"/>
    <text x="730" y="1352">Relación (acción [protocolo])</text>
  </g>
</svg>
