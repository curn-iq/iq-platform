<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="titulo desc" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="titulo">Diagrama de contenedores de IQ Platform</title>
  <desc id="desc">El estudiante explora las mesas por chat en el frontend de SIMIQ3D, consulta técnicas en el frontend web y practica con el frontend de SIVRI; el docente escribe, revisa y publica técnicas en el frontend web. El frontend web lee y escribe por la API de DataIQ, que usa la base de DataIQ. El frontend de SIMIQ3D envía la pregunta a su backend, que pide la acción al modelo de lenguaje, el catálogo a la API de DataIQ y guarda el registro en su base. El frontend de SIVRI pide un token corto a la API y envía cuadros al backend de SIVRI, que pide el catálogo a la API y guarda el progreso en su base.</desc>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4752"/>
    </marker>
    <marker id="ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1040" rx="18" fill="#ffffff"/>

  <!-- Título: tipo y alcance -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2933">Diagrama de contenedores de IQ Platform</text>
  <text x="40" y="72" font-size="13.5" fill="#5b6573">Qué piezas tiene y cómo se comunican · modelo C4, nivel 2</text>

  <!-- ===== Personas ===== -->
  <g text-anchor="middle">
    <circle cx="990" cy="108" r="15" fill="#3d4752"/>
    <rect x="910" y="126" width="160" height="56" rx="18" fill="#3d4752"/>
    <text x="990" y="151" font-size="14.5" font-weight="700" fill="#ffffff">Estudiante</text>
    <text x="990" y="169" font-size="11.5" fill="#d5dbe2">[Persona]</text>

    <circle cx="1210" cy="238" r="15" fill="#3d4752"/>
    <rect x="1130" y="256" width="160" height="56" rx="18" fill="#3d4752"/>
    <text x="1210" y="281" font-size="14.5" font-weight="700" fill="#ffffff">Docente o revisor</text>
    <text x="1210" y="299" font-size="11.5" fill="#d5dbe2">[Persona]</text>
  </g>

  <!-- Personas → contenedores -->
  <g fill="none" stroke="#3d4752" stroke-width="1.7">
    <polyline points="910,154 600,154 600,404" marker-end="url(#f)"/>
    <line x1="990" y1="182" x2="990" y2="404" marker-end="url(#f)"/>
    <polyline points="1070,154 1380,154 1380,404" marker-end="url(#f)"/>
    <line x1="1160" y1="312" x2="1110" y2="404" marker-end="url(#f)"/>
  </g>
  <g font-size="12" fill="#3d4752">
    <text x="612" y="250">Explora las mesas</text>
    <text x="612" y="265">por chat</text>
    <text x="978" y="250" text-anchor="end">Consulta técnicas</text>
    <text x="978" y="265" text-anchor="end" fill="#8a94a3">[HTTPS]</text>
    <text x="1392" y="250">Practica armando</text>
    <text x="1392" y="265">la mesa</text>
    <text x="1120" y="226" text-anchor="end">Escribe, revisa y</text>
    <text x="1120" y="241" text-anchor="end">publica técnicas</text>
  </g>

  <!-- ===== Límite del sistema ===== -->
  <rect x="40" y="346" width="1520" height="608" rx="16" fill="none" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="60" y="372" font-size="14" font-weight="700" fill="#3d4752">IQ Platform</text>
  <text x="150" y="372" font-size="12" fill="#5b6573">[Sistema]</text>

  <!-- ===== Contenedores ===== -->
  <g text-anchor="middle">
    <!-- SIMIQ3D: frontend -->
    <rect x="460" y="406" width="280" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="600" y="440" font-size="15" font-weight="700" fill="#1f2933">Frontend de SIMIQ3D</text>
    <text x="600" y="460" font-size="11.5" fill="#5b6573">[Contenedor: web, por definir]</text>
    <text x="600" y="484" font-size="12.5" fill="#3d4752">Chat y visor 3D</text>

    <!-- DataIQ: frontend -->
    <rect x="850" y="406" width="280" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="990" y="440" font-size="15" font-weight="700" fill="#1f2933">Frontend web</text>
    <text x="990" y="460" font-size="11.5" fill="#5b6573">[Contenedor: Angular]</text>
    <text x="990" y="484" font-size="12.5" fill="#3d4752">Shell y gestión de técnicas</text>

    <!-- SIVRI: frontend -->
    <rect x="1240" y="406" width="280" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="1380" y="440" font-size="15" font-weight="700" fill="#1f2933">Frontend de SIVRI</text>
    <text x="1380" y="460" font-size="11.5" fill="#5b6573">[Contenedor: Angular]</text>
    <text x="1380" y="484" font-size="12.5" fill="#3d4752">Cámara y retroalimentación</text>

    <!-- SIMIQ3D: modelo de lenguaje -->
    <rect x="70" y="616" width="280" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <text x="210" y="650" font-size="15" font-weight="700" fill="#1f2933">Modelo de lenguaje</text>
    <text x="210" y="670" font-size="11.5" fill="#5b6573">[Contenedor: Ollama]</text>
    <text x="210" y="694" font-size="12.5" fill="#3d4752">Elige la acción, no responde</text>

    <!-- SIMIQ3D: backend -->
    <rect x="460" y="616" width="280" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <text x="600" y="650" font-size="15" font-weight="700" fill="#1f2933">Backend de SIMIQ3D</text>
    <text x="600" y="670" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI]</text>
    <text x="600" y="694" font-size="12.5" fill="#3d4752">Arma la escena con DataIQ</text>

    <!-- DataIQ: API -->
    <rect x="850" y="616" width="280" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="990" y="650" font-size="15" font-weight="700" fill="#1f2933">API de DataIQ</text>
    <text x="990" y="670" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI]</text>
    <text x="990" y="694" font-size="12.5" fill="#3d4752">Técnicas, cuentas y sesiones</text>

    <!-- SIVRI: backend -->
    <rect x="1240" y="616" width="280" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="1380" y="650" font-size="15" font-weight="700" fill="#1f2933">Backend de SIVRI</text>
    <text x="1380" y="670" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI + YOLO26]</text>
    <text x="1380" y="694" font-size="12.5" fill="#3d4752">Reconoce y valida la mesa</text>

    <!-- Bases (cilindros) -->
    <path d="M490,814 V890 C490,904 710,904 710,890 V814" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <ellipse cx="600" cy="814" rx="110" ry="14" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8"/>
    <text x="600" y="856" font-size="15" font-weight="700" fill="#1f2933">Base de SIMIQ3D</text>
    <text x="600" y="876" font-size="11.5" fill="#5b6573">[Base de datos: PostgreSQL]</text>

    <path d="M880,814 V890 C880,904 1100,904 1100,890 V814" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <ellipse cx="990" cy="814" rx="110" ry="14" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="990" y="856" font-size="15" font-weight="700" fill="#1f2933">Base de DataIQ</text>
    <text x="990" y="876" font-size="11.5" fill="#5b6573">[Base de datos: PostgreSQL]</text>

    <path d="M1270,814 V890 C1270,904 1490,904 1490,890 V814" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <ellipse cx="1380" cy="814" rx="110" ry="14" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="1380" y="856" font-size="15" font-weight="700" fill="#1f2933">Base de SIVRI</text>
    <text x="1380" y="876" font-size="11.5" fill="#5b6573">[Base de datos: PostgreSQL]</text>
  </g>

  <!-- ===== Relaciones: una dirección, etiqueta y protocolo ===== -->
  <g fill="none" stroke="#3d4752" stroke-width="1.7">
    <!-- SIMIQ3D -->
    <line x1="600" y1="506" x2="600" y2="614" marker-end="url(#f)"/>
    <line x1="460" y1="666" x2="352" y2="666" marker-end="url(#f)"/>
    <line x1="740" y1="666" x2="848" y2="666" marker-end="url(#f)"/>
    <!-- DataIQ -->
    <line x1="990" y1="506" x2="990" y2="614" marker-end="url(#f)"/>
    <line x1="990" y1="716" x2="990" y2="798" marker-end="url(#f)"/>
    <!-- SIVRI -->
    <line x1="1380" y1="506" x2="1380" y2="614" marker-end="url(#f)"/>
    <line x1="1270" y1="506" x2="1118" y2="614" marker-end="url(#f)"/>
    <line x1="1240" y1="666" x2="1132" y2="666" marker-end="url(#f)"/>
  </g>
  <g fill="none" stroke="#3d4752" stroke-width="1.7">
    <line x1="600" y1="716" x2="600" y2="798" marker-end="url(#f)"/>
    <line x1="1380" y1="716" x2="1380" y2="798" marker-end="url(#f)"/>
  </g>

  <g font-size="12" fill="#3d4752">
    <text x="610" y="554">Envía la pregunta</text>
    <text x="610" y="569" fill="#8a94a3">[JSON/HTTPS, cookie]</text>

    <text x="406" y="656" text-anchor="middle">Pide la acción</text>
    <text x="406" y="684" text-anchor="middle" fill="#8a94a3">[HTTPS, clave]</text>

    <text x="794" y="656" text-anchor="middle">Pide el catálogo</text>
    <text x="794" y="684" text-anchor="middle" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="610" y="762">Guarda el registro</text>
    <text x="610" y="777" fill="#8a94a3">[SQL]</text>

    <text x="1000" y="554">Lee y escribe datos</text>
    <text x="1000" y="569" fill="#8a94a3">[JSON/HTTPS, cookie]</text>

    <text x="1000" y="762">Lee y escribe</text>
    <text x="1000" y="777" fill="#8a94a3">[SQL]</text>

    <text x="1236" y="580">Pide un token corto</text>
    <text x="1236" y="595" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="1390" y="554">Envía 2–3 cuadros/s</text>
    <text x="1390" y="569" fill="#8a94a3">[HTTPS, token]</text>

    <text x="1186" y="656" text-anchor="middle">Pide el catálogo</text>
    <text x="1186" y="684" text-anchor="middle" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="1390" y="762">Guarda el progreso</text>
    <text x="1390" y="777" fill="#8a94a3">[SQL]</text>
  </g>

  <!-- ===== Leyenda ===== -->
  <g font-size="12" fill="#5b6573">
    <text x="40" y="1000" font-weight="700" fill="#3d4752">Leyenda</text>
    <rect x="110" y="986" width="18" height="18" rx="6" fill="#3d4752"/>
    <text x="134" y="1000">Persona</text>
    <rect x="200" y="986" width="18" height="18" rx="4" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.5"/>
    <text x="224" y="1000">DataIQ</text>
    <rect x="286" y="986" width="18" height="18" rx="4" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.5"/>
    <text x="310" y="1000">SIVRI</text>
    <rect x="362" y="986" width="18" height="18" rx="4" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.5"/>
    <text x="386" y="1000">SIMIQ3D</text>
    <rect x="458" y="986" width="18" height="18" rx="4" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="482" y="1000">Por definir</text>
    <line x1="568" y1="995" x2="604" y2="995" stroke="#3d4752" stroke-width="1.7" marker-end="url(#f)"/>
    <text x="612" y="1000">Relación (acción [protocolo])</text>
  </g>
</svg>
