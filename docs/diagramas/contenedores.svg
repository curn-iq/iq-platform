<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-labelledby="titulo desc" font-family="'Noto Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title id="titulo">Diagrama de contenedores de IQ Platform</title>
  <desc id="desc">El docente usa el frontend web para escribir, revisar y publicar técnicas; el estudiante lo usa para consultarlas y usa el frontend de SIVRI para practicar. El frontend lee y escribe por la API de DataIQ, que usa la base de DataIQ. El frontend de SIVRI pide un token corto a la API y envía cuadros al backend de SIVRI, que pide el catálogo a la API. SIMIQ3D, por definir, también consultará el catálogo.</desc>

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4752"/>
    </marker>
    <marker id="ft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="950" rx="18" fill="#ffffff"/>

  <!-- Título: tipo y alcance -->
  <text x="40" y="48" font-size="22" font-weight="700" fill="#1f2933">Diagrama de contenedores de IQ Platform</text>
  <text x="40" y="72" font-size="13.5" fill="#5b6573">Qué piezas tiene y cómo se comunican · modelo C4, nivel 2</text>

  <!-- ===== Personas ===== -->
  <g text-anchor="middle">
    <circle cx="330" cy="108" r="15" fill="#3d4752"/>
    <rect x="250" y="126" width="160" height="56" rx="18" fill="#3d4752"/>
    <text x="330" y="151" font-size="14.5" font-weight="700" fill="#ffffff">Docente o revisor</text>
    <text x="330" y="169" font-size="11.5" fill="#d5dbe2">[Persona]</text>

    <circle cx="600" cy="108" r="15" fill="#3d4752"/>
    <rect x="520" y="126" width="160" height="56" rx="18" fill="#3d4752"/>
    <text x="600" y="151" font-size="14.5" font-weight="700" fill="#ffffff">Estudiante</text>
    <text x="600" y="169" font-size="11.5" fill="#d5dbe2">[Persona]</text>
  </g>

  <!-- Personas → contenedores -->
  <g fill="none" stroke="#3d4752" stroke-width="1.7">
    <line x1="350" y1="182" x2="530" y2="324" marker-end="url(#f)"/>
    <line x1="600" y1="182" x2="600" y2="324" marker-end="url(#f)"/>
    <line x1="660" y1="182" x2="960" y2="324" marker-end="url(#f)"/>
  </g>
  <g font-size="12" fill="#3d4752">
    <text x="366" y="214" text-anchor="end">Escribe, revisa y</text>
    <text x="366" y="229" text-anchor="end">publica técnicas</text>
    <text x="590" y="214" text-anchor="end">Consulta técnicas</text>
    <text x="590" y="229" text-anchor="end" fill="#8a94a3">[HTTPS]</text>
    <text x="846" y="214">Practica armando</text>
    <text x="846" y="229">la mesa</text>
  </g>

  <g transform="translate(0 30)">
  <!-- ===== Límite del sistema ===== -->
  <rect x="40" y="236" width="1120" height="608" rx="16" fill="none" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="60" y="262" font-size="14" font-weight="700" fill="#3d4752">IQ Platform</text>
  <text x="150" y="262" font-size="12" fill="#5b6573">[Sistema]</text>

  <!-- ===== Contenedores ===== -->
  <g text-anchor="middle">
    <!-- Frontend web (DataIQ) -->
    <rect x="460" y="296" width="280" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="600" y="330" font-size="15" font-weight="700" fill="#1f2933">Frontend web</text>
    <text x="600" y="350" font-size="11.5" fill="#5b6573">[Contenedor: Angular]</text>
    <text x="600" y="374" font-size="12.5" fill="#3d4752">Shell y gestión de técnicas</text>

    <!-- Frontend de SIVRI (por definir) -->
    <rect x="850" y="296" width="280" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="990" y="330" font-size="15" font-weight="700" fill="#1f2933">Frontend de SIVRI</text>
    <text x="990" y="350" font-size="11.5" fill="#5b6573">[Contenedor: web, por definir]</text>
    <text x="990" y="374" font-size="12.5" fill="#3d4752">Cámara y retroalimentación</text>

    <!-- SIMIQ3D (por definir) -->
    <rect x="70" y="506" width="280" height="100" rx="12" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="210" y="540" font-size="15" font-weight="700" fill="#1f2933">SIMIQ3D</text>
    <text x="210" y="560" font-size="11.5" fill="#5b6573">[Contenedores por definir]</text>
    <text x="210" y="584" font-size="12.5" fill="#3d4752">Chat y visor 3D</text>

    <!-- API de DataIQ -->
    <rect x="460" y="506" width="280" height="100" rx="12" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="600" y="540" font-size="15" font-weight="700" fill="#1f2933">API de DataIQ</text>
    <text x="600" y="560" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI]</text>
    <text x="600" y="584" font-size="12.5" fill="#3d4752">Técnicas, cuentas y sesiones</text>

    <!-- Backend de SIVRI -->
    <rect x="850" y="506" width="280" height="100" rx="12" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8"/>
    <text x="990" y="540" font-size="15" font-weight="700" fill="#1f2933">Backend de SIVRI</text>
    <text x="990" y="560" font-size="11.5" fill="#5b6573">[Contenedor: FastAPI + YOLO26]</text>
    <text x="990" y="584" font-size="12.5" fill="#3d4752">Reconoce y valida la mesa</text>

    <!-- Base de DataIQ (cilindro) -->
    <path d="M490,704 V780 C490,794 710,794 710,780 V704" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <ellipse cx="600" cy="704" rx="110" ry="14" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.8"/>
    <text x="600" y="746" font-size="15" font-weight="700" fill="#1f2933">Base de DataIQ</text>
    <text x="600" y="766" font-size="11.5" fill="#5b6573">[Base de datos: PostgreSQL]</text>

    <!-- Base de SIVRI (por definir) -->
    <path d="M880,704 V780 C880,794 1100,794 1100,780 V704" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8" stroke-dasharray="7 5"/>
    <ellipse cx="990" cy="704" rx="110" ry="14" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.8" stroke-dasharray="7 5"/>
    <text x="990" y="746" font-size="15" font-weight="700" fill="#1f2933">Base de SIVRI</text>
    <text x="990" y="766" font-size="11.5" fill="#5b6573">[Base de datos: PostgreSQL]</text>
  </g>

  <!-- ===== Relaciones: una dirección, etiqueta y protocolo ===== -->
  <g fill="none" stroke="#3d4752" stroke-width="1.7">
    <line x1="600" y1="396" x2="600" y2="504" marker-end="url(#f)"/>
    <line x1="600" y1="606" x2="600" y2="688" marker-end="url(#f)"/>
    <line x1="990" y1="396" x2="990" y2="504" marker-end="url(#f)"/>
    <line x1="880" y1="396" x2="728" y2="504" marker-end="url(#f)"/>
    <line x1="850" y1="556" x2="742" y2="556" marker-end="url(#f)"/>
  </g>
  <g fill="none" stroke="#8a94a3" stroke-width="1.7" stroke-dasharray="6 5">
    <line x1="350" y1="556" x2="458" y2="556" marker-end="url(#ft)"/>
    <line x1="990" y1="606" x2="990" y2="688" marker-end="url(#ft)"/>
  </g>

  <g font-size="12" fill="#3d4752">
    <text x="610" y="444">Lee y escribe datos</text>
    <text x="610" y="459" fill="#8a94a3">[JSON/HTTPS, cookie]</text>

    <text x="846" y="470">Pide un token corto</text>
    <text x="846" y="485" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="1000" y="444">Envía 2–3 cuadros/s</text>
    <text x="1000" y="459" fill="#8a94a3">[HTTPS, token]</text>

    <text x="796" y="546" text-anchor="middle">Pide el catálogo</text>
    <text x="796" y="574" text-anchor="middle" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="404" y="546" text-anchor="middle">Pide el catálogo</text>
    <text x="404" y="574" text-anchor="middle" fill="#8a94a3">[JSON/HTTPS]</text>

    <text x="610" y="652">Lee y escribe</text>
    <text x="610" y="667" fill="#8a94a3">[SQL]</text>

    <text x="1000" y="652">Guarda el progreso</text>
    <text x="1000" y="667" fill="#8a94a3">[SQL]</text>
  </g>

  <!-- ===== Leyenda ===== -->
  <g font-size="12" fill="#5b6573">
    <text x="40" y="880" font-weight="700" fill="#3d4752">Leyenda</text>
    <rect x="110" y="866" width="18" height="18" rx="6" fill="#3d4752"/>
    <text x="134" y="880">Persona</text>
    <rect x="200" y="866" width="18" height="18" rx="4" fill="#eaf1fb" stroke="#1d5fae" stroke-width="1.5"/>
    <text x="224" y="880">DataIQ</text>
    <rect x="286" y="866" width="18" height="18" rx="4" fill="#fdf3e2" stroke="#c77d14" stroke-width="1.5"/>
    <text x="310" y="880">SIVRI</text>
    <rect x="362" y="866" width="18" height="18" rx="4" fill="#f3eefa" stroke="#7a5bb8" stroke-width="1.5"/>
    <text x="386" y="880">SIMIQ3D</text>
    <rect x="458" y="866" width="18" height="18" rx="4" fill="#ffffff" stroke="#8a94a3" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="482" y="880">Por definir</text>
    <line x1="568" y1="875" x2="604" y2="875" stroke="#3d4752" stroke-width="1.7" marker-end="url(#f)"/>
    <text x="612" y="880">Relación (acción [protocolo])</text>
  </g>
  </g>
</svg>
