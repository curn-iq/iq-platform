@if (mobile()) {
  <h1 class="name">
    <button type="button" class="name-button" aria-haspopup="dialog" (click)="openSheet.emit()">
      {{ title() }}
      <span class="chevron" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 12 12">
          <path
            d="M2.5 4.5L6 8l3.5-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </span>
    </button>
  </h1>
  @if (meta(); as line) {
    <p class="meta">{{ line }}</p>
  }
} @else {
  <h1 class="name">{{ title() }}</h1>
  @if (meta(); as line) {
    <p class="meta">{{ line }}</p>
  }
  <div class="actions">
    <div class="selector">
      <button
        type="button"
        class="trigger"
        role="combobox"
        aria-label="Técnica"
        aria-haspopup="listbox"
        aria-controls="technique-list"
        [attr.aria-expanded]="open()"
        [attr.aria-activedescendant]="open() ? 'technique-option-' + active() : null"
        (click)="toggle()"
        (keydown)="onKeydown($event)"
      >
        <span>{{ label() }}</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" class="arrow">
          <path
            d="M2.5 4.5L6 8l3.5-3.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      @if (open()) {
        <ul class="list" id="technique-list" role="listbox" aria-label="Técnicas">
          @for (technique of techniques(); track technique.id; let i = $index) {
            <li
              role="option"
              [id]="'technique-option-' + i"
              [attr.aria-selected]="technique.id === currentId()"
              [class.active]="i === active()"
              (pointermove)="active.set(i)"
              (click)="select(technique.id)"
            >
              <span>{{ technique.name }}</span>
              @if (technique.id === currentId()) {
                <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
                  <path
                    d="M3 7.5l2.6 2.6L11 4.6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.9"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              }
            </li>
          }
        </ul>
      }
    </div>
  </div>
}
