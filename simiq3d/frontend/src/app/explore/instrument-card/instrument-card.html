<section class="card" aria-live="polite" [attr.aria-label]="item().name">
  <div class="head">
    <span class="number" aria-hidden="true">{{ item().legendNumber ?? '–' }}</span>
    <h2>{{ item().name }}</h2>
    <button type="button" class="close" aria-label="Cerrar ficha" (click)="close.emit()">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M4 4l8 8M12 4l-8 8"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    </button>
  </div>
  <div class="text">
    @for (text of texts(); track text.id) {
      <p>
        @if (texts().length > 1) {
          <strong>{{ text.name }}.</strong>
        }
        {{ text.text || 'Sin descripción en DataIQ.' }}
      </p>
    } @empty {
      <p class="missing">Sin descripción en DataIQ.</p>
    }
  </div>
  @if (hasMore()) {
    <button
      type="button"
      class="more"
      [attr.aria-expanded]="expanded()"
      (click)="expanded.set(!expanded())"
    >
      {{ expanded() ? 'Ver menos' : 'Ver más' }}
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path
          d="M2.5 4.5L6 8l3.5-3.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
  }
</section>
