<button
  type="button"
  class="toggle"
  aria-controls="legend-panel"
  [attr.aria-expanded]="open() && !disabled()"
  [disabled]="disabled()"
  (click)="open.set(!open())"
>
  Leyenda <span class="count">{{ items().length }}</span>
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
    <path
      d="M2.5 4.5L6 8l3.5-3.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

@if (open() && !disabled()) {
  <aside class="panel" id="legend-panel" aria-label="Leyenda de la mesa">
    <div class="panel-head">
      <h2>Mesa de Mayo</h2>
      <p>Toca un número para ubicarlo.</p>
    </div>
    <ol>
      @for (item of items(); track item.id) {
        <li>
          <button
            type="button"
            class="piece"
            [attr.aria-current]="item.id === selected()"
            (click)="choose.emit(item.id)"
          >
            <span class="number">{{ item.legendNumber ?? '–' }}</span>
            <strong>{{ item.name }}</strong>
          </button>
        </li>
      }
    </ol>
  </aside>
}
