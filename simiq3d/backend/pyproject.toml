[project]
name = "simiq3d-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.156.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Avisa de los imports sin usar (F401), pero no los borra al guardar.
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
# Migraciones generadas por Alembic: llevan SQL largo que no se puede partir.
"migrations/versions/*" = ["E501"]

# Vercel carga la app de FastAPI desde aquí
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
