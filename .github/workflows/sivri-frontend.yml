# Frontend de SIVRI: build y pruebas en cada PR; en main, el despliegue a Vercel
# (producción). El navegador llega a la app por el rewrite /sivri/ del proyecto del
# shell, que se agrega cuando exista el proyecto de Vercel (sivri/frontend/README.md,
# «Despliegue»).

name: SIVRI frontend

on:
  pull_request:
    paths:
      - "sivri/frontend/**"
      - "shared/design/**"
      # La barra compartida: el build la lee por el enlace src/shared-shell
      - "shared/shell/**"
      - ".github/workflows/sivri-frontend.yml"
  push:
    branches: [main]
    paths:
      - "sivri/frontend/**"
      - "shared/design/**"
      # La barra compartida: el build la lee por el enlace src/shared-shell
      - "shared/shell/**"
      - ".github/workflows/sivri-frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: sivri/frontend

jobs:
  test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sivri/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false

  deploy:
    name: Despliegue en Vercel (producción)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un despliegue a la vez: si llegan dos pushes seguidos, el segundo espera
    concurrency: vercel-produccion-sivri-frontend
    env:
      # No son secretos: identifican la cuenta y el proyecto de Vercel. El proyecto
      # está en la cuenta de Juan, no en la de Mauricio como los demás, y se publica
      # con su propio token (VERCEL_TOKEN_SIVRI; sivri/frontend/README.md,
      # «Despliegue»). Mientras alguno valga POR_DEFINIR, el despliegue se omite.
      VERCEL_ORG_ID: POR_DEFINIR
      VERCEL_PROJECT_ID: POR_DEFINIR
    steps:
      - name: Proyecto de Vercel
        id: project
        working-directory: .
        run: |
          if [ "$VERCEL_ORG_ID" = "POR_DEFINIR" ] || [ "$VERCEL_PROJECT_ID" = "POR_DEFINIR" ]; then
            echo "::notice::Faltan VERCEL_ORG_ID o VERCEL_PROJECT_ID del proyecto de Vercel de SIVRI: no se despliega."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.project.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.project.outputs.ready == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sivri/frontend/package-lock.json
      - run: npm ci
        if: steps.project.outputs.ready == 'true'
      - run: npm run build
        if: steps.project.outputs.ready == 'true'
      # El shell trae la app con la ruta completa (/sivri/…), así que se publica
      # dentro de sivri/, con vercel.json (encabezados y rutas) al lado. Vercel no la
      # construye: el build lee ../../shared/ (design y shell).
      - name: Carpeta que se publica
        if: steps.project.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/deploy/sivri"
          cp -r dist/sivri/browser/. "$RUNNER_TEMP/deploy/sivri/"
          cp vercel.json "$RUNNER_TEMP/deploy/"
      # El plan Hobby no conecta repos de una organización de GitHub: por eso
      # se despliega con el CLI y un token
      - working-directory: ${{ runner.temp }}/deploy
        if: steps.project.outputs.ready == 'true'
        run: npx --yes vercel@64.0.2 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN_SIVRI }}
