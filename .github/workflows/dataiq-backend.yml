# Backend de DataIQ: pruebas en cada PR; en main, el despliegue a Vercel
# (producción) y la imagen a ghcr.io (para correrlo en cualquier otro lado).

name: DataIQ backend

on:
  pull_request:
    paths:
      - "dataiq/backend/**"
      - ".github/workflows/dataiq-backend.yml"
  push:
    branches: [main]
    paths:
      - "dataiq/backend/**"
      - ".github/workflows/dataiq-backend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: dataiq/backend

jobs:
  test:
    name: Estilo y pruebas
    runs-on: ubuntu-latest
    services:
      # Las pruebas crean y migran su propia base, dataiq_test, en este servidor
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dataiq
          POSTGRES_PASSWORD: dataiq
          POSTGRES_DB: dataiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dataiq:dataiq@localhost:5432/dataiq
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.18"
          python-version: "3.14"
      - run: uv sync --locked
      - name: Clave de firma de prueba (se genera en cada corrida, no es la real)
        run: echo "JWT_PRIVATE_KEY=$(python -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest

  image:
    name: Imagen en ghcr.io
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      # Un tag por commit: Cloud Run guarda en caché las imágenes de ghcr.io
      # hasta una hora, así que desplegar siempre "latest" podría no actualizar.
      - uses: docker/build-push-action@v7
        with:
          context: dataiq/backend
          push: true
          tags: |
            ghcr.io/curn-iq/dataiq-backend:${{ github.sha }}
            ghcr.io/curn-iq/dataiq-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Despliegue en Vercel (producción)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Un despliegue a la vez: si llegan dos pushes seguidos, el segundo espera
    concurrency: vercel-produccion
    env:
      # No son secretos: identifican la cuenta y el proyecto de Vercel
      # (dataiq/backend/.vercel/project.json, que no se sube al repo)
      VERCEL_ORG_ID: team_kERz1HRzI8vWnJGvFNhEi5N1
      VERCEL_PROJECT_ID: prj_2WlkLXYrBnZVyoHV3gkriR5vhpYW
    steps:
      - uses: actions/checkout@v7
      # Vercel construye en sus servidores, igual que el despliegue a mano.
      # Las variables de entorno (DATABASE_URL, JWT_PRIVATE_KEY…) viven en el
      # proyecto de Vercel, no aquí. El plan Hobby no conecta repos de una
      # organización de GitHub: por eso se despliega con el CLI y un token.
      - run: npx --yes vercel@64.0.2 deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
