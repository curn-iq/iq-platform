<div class="who">
  <app-avatar [name]="account().name" size="medium" />
  <div class="who-text">
    <p class="name">{{ account().name }}</p>
    <p class="email">{{ account().email }}</p>
    <span class="role">{{ roleLabel() }}</span>
  </div>
</div>

@if (links().length) {
  <p class="title">Gestión de DataIQ</p>
  <ul class="links">
    @for (link of links(); track link.route) {
      <li>
        <a [routerLink]="link.route" routerLinkActive ariaCurrentWhenActive="page"
          >{{ link.label }}
          @if (link.count !== null) {
            <span class="count">{{ link.count }}</span>
          }
        </a>
      </li>
    }
  </ul>
}

<button type="button" class="exit" [attr.aria-busy]="signOut.busy()" (click)="exit()">
  Cerrar sesión
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
    <path
      d="M6.5 3H4a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 4 13h2.5M10 5l3 3-3 3M13 8H6.5"
      fill="none"
      stroke="currentColor"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>
