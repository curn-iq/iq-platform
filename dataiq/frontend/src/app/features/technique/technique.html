@if (notFound()) {
  <app-not-found />
} @else {
  <div class="app">
    <app-technique-column [currentId]="techniqueId()" [tab]="tab()!.slug" />
    <article class="panel" aria-labelledby="technique-name" [attr.aria-busy]="!technique()">
      <header>
        @if (technique(); as technique) {
          <h1 id="technique-name">{{ technique.name }}</h1>
          <p>{{ technique.specialty }}</p>
        } @else {
          <h1 id="technique-name" class="sr-only">Cargando…</h1>
          <span class="bone name" aria-hidden="true"></span>
          <span class="bone specialty" aria-hidden="true"></span>
        }
      </header>
      <app-tabs label="Contenido de la técnica" [tabs]="tabItems()" [current]="tab()!.slug" />
      <section
        class="sheet"
        role="tabpanel"
        [id]="'panel-' + tab()!.slug"
        [attr.aria-labelledby]="'tab-' + tab()!.slug"
      ></section>
    </article>
  </div>
}
