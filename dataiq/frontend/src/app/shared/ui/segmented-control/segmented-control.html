<div class="group" role="group" [attr.aria-label]="label()">
  <span
    class="plate"
    aria-hidden="true"
    [class.ready]="plateReady()"
    [style.width.px]="plateWidth()"
    [style.transform]="'translateX(' + plateLeft() + 'px)'"
  ></span>
  @for (option of options(); track option.key) {
    <button
      #button
      type="button"
      [disabled]="disabled()"
      [attr.aria-pressed]="option.key === value()"
      (click)="choose(option.key)"
    >
      {{ option.label }}
      @if (option.count !== undefined) {
        <span class="count">{{ option.count }}</span>
      }
    </button>
  }
</div>
