<p class="label" [id]="id + '-label'">{{ label() }}</p>
<div class="chips" role="group" [attr.aria-labelledby]="id + '-label'">
  @for (name of names(); track $index) {
    <span class="chip">
      {{ name }}
      @if (!readonly()) {
        <button
          type="button"
          class="remove"
          [attr.aria-label]="'Quitar ' + name"
          (click)="removed.emit($index)"
        >
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path
              d="M3 3l6 6M9 3l-6 6"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
      }
    </span>
  }
  @if (!readonly()) {
    @if (adding()) {
      <input
        #field
        class="new"
        type="text"
        autocomplete="off"
        [attr.aria-label]="inputLabel()"
        (keydown)="onKey($event)"
        (blur)="commit()"
      />
    }
    <button type="button" class="add" (click)="startAdding()">
      <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 3v10M3 8h10"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
      Agregar
    </button>
  }
</div>
