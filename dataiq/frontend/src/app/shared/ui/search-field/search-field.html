<svg class="lens" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
  <circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8" />
  <path
    d="M13 13l4.5 4.5"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
  />
</svg>
<label class="sr-only" [for]="id">{{ label() }}</label>
<input
  #field
  type="search"
  autocomplete="off"
  [id]="id"
  [placeholder]="placeholder()"
  [value]="value()"
  (input)="value.set(field.value)"
/>
@if (value()) {
  <button type="button" class="clear" aria-label="Borrar la búsqueda" (click)="clear()">
    <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
      <path
        d="M4 4l8 8M12 4l-8 8"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
      />
    </svg>
  </button>
}
