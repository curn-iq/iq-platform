<label [for]="id">
  <span>{{ label() }}</span>
  {{ ' ' }}
  @if (optional()) {
    <span class="optional">Opcional</span>
  } @else if (badge()) {
    <span class="badge">{{ badge() }}</span>
  }
</label>
<div class="control">
  <input
    #field
    [id]="id"
    [type]="shown() ? 'text' : type()"
    [attr.autocomplete]="autocomplete() || null"
    [placeholder]="placeholder()"
    [readOnly]="readonly()"
    [attr.inputmode]="inputmode() || null"
    [class.revealable]="revealable()"
    [attr.spellcheck]="type() === 'text' ? null : 'false'"
    [attr.autocapitalize]="type() === 'text' ? null : 'none'"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="error() ? id + '-error' : null"
    [value]="value()"
    (input)="value.set(field.value)"
    (blur)="touch.emit()"
  />
  @if (revealable()) {
    <button
      type="button"
      [attr.aria-controls]="id"
      (mousedown)="$event.preventDefault()"
      (click)="toggle()"
    >
      {{ shown() ? 'Ocultar' : 'Mostrar' }}
    </button>
  }
</div>
@if (error(); as message) {
  <app-field-error [id]="id + '-error'" [message]="message" />
}
