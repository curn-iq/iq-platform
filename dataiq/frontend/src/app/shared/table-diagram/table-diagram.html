<svg
  #svg
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  [style.--number-scale]="numberScale()"
  [style.--steel-fill]="'url(#' + steelId + ')'"
  [style.--blade-fill]="'url(#' + bladeId + ')'"
  [class.marking]="highlighted() !== null"
  [attr.role]="preview() ? null : 'group'"
  [attr.aria-label]="preview() ? null : table().name"
  [attr.aria-hidden]="preview() ? 'true' : null"
>
  <defs app-steel-gradients [steelId]="steelId" [bladeId]="bladeId" />
  <g class="grid" aria-hidden="true">
    @for (x of columnLines(); track x) {
      <path class="grid-line" data-axis="column" [attr.d]="'M' + x + ' 0V' + height()" />
    }
    @for (y of rowLines(); track y) {
      <path class="grid-line" data-axis="row" [attr.d]="'M0 ' + y + 'H' + width()" />
    }
  </g>
  <!-- Todas las formas en una capa con una sola sombra: atenuar las demás no recalcula una sombra por pieza -->
  <g class="shapes" aria-hidden="true">
    @for (piece of pieces(); track piece.id) {
      <g class="placing" [style.--i]="$index">
        <g
          class="shape"
          [class.flat]="piece.flat"
          [class.active]="piece.linked && piece.legendNumber === highlighted()"
        >
          @for (shape of piece.shapes; track $index) {
            @if (shape.kind === 'unknown') {
              <rect
                class="unknown"
                [attr.transform]="shape.transform"
                [attr.x]="-shape.width! / 2"
                [attr.y]="-shape.height! / 2"
                [attr.width]="shape.width"
                [attr.height]="shape.height"
                rx="8"
              />
            } @else {
              <g
                [attr.transform]="shape.transform"
                [attr.data-drawing]="shape.key"
                [attr.data-kind]="shape.kind"
              >
                <g app-drawing-parts [parts]="shape.parts" />
              </g>
            }
          }
        </g>
      </g>
    }
  </g>
  <!-- Encima, cada pieza: una zona de clic por celda y su número, que nunca se atenúa ni queda tapado -->
  @for (piece of pieces(); track piece.id) {
    <g
      class="piece placing"
      [class.active]="piece.linked && piece.legendNumber === highlighted()"
      [style.--i]="$index"
      [attr.data-n]="piece.linked ? piece.legendNumber : null"
      [attr.tabindex]="piece.linked ? 0 : null"
      [attr.role]="piece.linked ? 'img' : null"
      [attr.aria-label]="piece.linked ? piece.label : null"
      (mouseenter)="enter(piece.legendNumber)"
      (mouseleave)="leave(piece.legendNumber)"
      (focus)="focus(piece.legendNumber)"
      (blur)="blur(piece.legendNumber)"
    >
      @for (hit of piece.hits; track $index) {
        <rect
          class="hit"
          [attr.x]="hit.x"
          [attr.y]="hit.y"
          [attr.width]="cell"
          [attr.height]="cell"
        />
      }
      @if (piece.number; as position) {
        <g class="number">
          <circle [attr.cx]="position.x" [attr.cy]="position.y" [attr.r]="numberRadius" />
          <text [attr.x]="position.x" [attr.y]="position.y">{{ piece.legendNumber }}</text>
        </g>
      }
    </g>
  }
</svg>
