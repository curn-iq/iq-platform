<svg:linearGradient
  class="steel-gradient"
  [id]="steelId()"
  gradientUnits="userSpaceOnUse"
  x1="-8"
  y1="0"
  x2="8"
  y2="0"
>
  <svg:stop class="stop-light" offset="0" />
  <svg:stop class="stop-glint" offset=".32" />
  <svg:stop class="stop-steel" offset=".56" />
  <svg:stop class="stop-shade" offset=".74" />
  <svg:stop class="stop-dim" offset="1" />
</svg:linearGradient>
<svg:linearGradient
  class="blade-gradient"
  [id]="bladeId()"
  gradientUnits="userSpaceOnUse"
  x1="-3"
  y1="0"
  x2="5"
  y2="0"
>
  <svg:stop class="stop-glint" offset="0" />
  <svg:stop class="stop-white" offset=".5" />
  <svg:stop class="stop-blade" offset="1" />
</svg:linearGradient>
